  <body>
    <section id="sign-in-screen" class="mode-screen" hidden>
      <div class="mode-card">
        <p class="mode-eyebrow">HEMA Competition</p>
        <h1>Sign in to continue</h1>
        <p class="mode-copy">Sign in with your Google account to record and publish bouts.</p>

        <p id="sign-in-error" class="mode-copy sign-in-error"></p>

    <competition-selector-view id="competition-selector-view" hidden></competition-selector-view>

    <participants-view id="participants-view" hidden></participants-view>
    <bouts-view id="bouts-view" hidden></bouts-view>
    <bout-details-view id="bout-details-view" hidden></bout-details-view>
    <new-bout-view id="new-bout-view" hidden></new-bout-view>
    <fight-view id="fight-view" hidden></fight-view>
    <match-publish-view id="match-publish-view" hidden></match-publish-view>

    <score-view id="score-view"></score-view>
    <warning-view id="warning-view"></warning-view>
    <action-dialog
      id="forfeit-dialog"
      heading="Match forfeited"
      description="Record the reason and the fighter who forfeited the match."
    ></action-dialog>

  </body>
