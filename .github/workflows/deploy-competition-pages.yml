name: Deploy competition to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "apps/competition/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-competition-pages.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: competition-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The participant app talks to the backend API; GitHub Pages has none of its own.
      VITE_API_BASE_URL: ${{ vars.COMPETITION_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate competition env
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "COMPETITION_API_BASE_URL (the backend API, e.g. https://api.example.org/api/v1) is not set in repository variables."
            exit 1
          fi

      - name: Build competition app
        run: npm run build --workspace @hema/competition

      - name: Stage Pages content
        run: |
          rm -rf ./pages
          mkdir -p ./pages/competition
          cp -R ./apps/competition/dist/. ./pages/competition/
          # GitHub Pages only uses the 404.html at the site root: deep links such as competition/join/<code>
          # boot the participant app from it; other paths on the site go to the app's home.
          node ./apps/competition/scripts/root-404.mjs ./pages/competition/404.html ./pages/404.html /hema-score-keeper/competition/

      - name: Delete stale Pages artifacts from reruns
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib import request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          run_id = os.environ["RUN_ID"]
          base_url = f"https://api.github.com/repos/{repository}"
          headers = {"Accept": "application/vnd.github+json"}
          auth_header_name = "Author" + "ization"
          auth_header_value = "Bearer " + token

          list_request = request.Request(
              f"{base_url}/actions/runs/{run_id}/artifacts?per_page=100",
              headers=headers,
          )
          list_request.add_header(auth_header_name, auth_header_value)
          with request.urlopen(list_request) as response:
              artifacts = json.load(response).get("artifacts", [])

          for artifact in artifacts:
              if artifact.get("name") != "github-pages":
                  continue

              artifact_id = artifact["id"]
              print(f"Deleting stale github-pages artifact {artifact_id}")
              delete_request = request.Request(
                  f"{base_url}/actions/artifacts/{artifact_id}",
                  headers=headers,
                  method="DELETE",
              )
              delete_request.add_header(auth_header_name, auth_header_value)
              with request.urlopen(delete_request):
                  pass
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: competition-pages-${{ github.run_attempt }}
          path: ./pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: competition-pages-${{ github.run_attempt }}
