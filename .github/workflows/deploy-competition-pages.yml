name: Deploy competition to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "apps/competition/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-competition-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: competition-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build competition app
        run: npm run build --workspace @hema/competition

      - name: Stage Pages content
        run: |
          rm -rf ./pages
          mkdir -p ./pages/competition
          cp -R ./apps/competition/dist/. ./pages/competition/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: competition-pages-${{ github.run_attempt }}
          path: ./pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: competition-pages-${{ github.run_attempt }}
